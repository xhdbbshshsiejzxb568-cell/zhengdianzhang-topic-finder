<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>采样结果回传</title><style>body{max-width:900px;margin:40px auto;font:17px system-ui;background:#f4f6f2}input,textarea{display:block;width:100%;margin:12px 0;padding:12px}textarea{height:400px}button{padding:12px 24px}pre{white-space:pre-wrap}</style><h1>采样结果回传</h1><p>仅用于当前已领取请求的真实浏览器结果。提交后程序校验原文、去重并原子保存。</p><label>请求ID<input id="request" autocomplete="off"></label><label>结果JSON<textarea id="payload"></textarea></label><button id="submit">校验并保存</button><pre id="result"></pre><script>document.querySelector('#submit').onclick=async()=>{try{const payload=JSON.parse(document.querySelector('#payload').value);const r=await fetch('/api/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:document.querySelector('#request').value,payload})});const data=await r.json();document.querySelector('#result').textContent=JSON.stringify(data,null,2)}catch(e){document.querySelector('#result').textContent=String(e)}};</script></html>
